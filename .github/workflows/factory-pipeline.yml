# =============================================================================
# factory-pipeline — runs the four OpenCode agent workspaces against every
# target repo in vars.TARGET_REPOS.
#
# One target-pipeline chain runs per target repo, isolated from the others:
#   product-manager -> solution-architect -> backend-developer -> web-developer
# =============================================================================
name: factory-pipeline

on:
  workflow_dispatch:

jobs:
  run_target:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.TARGET_REPOS) }}
    concurrency:
      group: factory-${{ matrix.target }}
      cancel-in-progress: false
    uses: ./.github/workflows/target-pipeline.yml
    with:
      target: ${{ matrix.target }}
    secrets: inherit
